  valid_in_scenarios:
  - S1
  valid_conditionally_in_scenarios:
  - S3
- id: OBJ-mitigate
  class: mitigate
  endpoint_level: cellular_outcome
  endpoint: 微核率與衰老標記
  assay: 胞質分裂阻斷微核試驗（CBMN）；SA-β-gal 或 p16 轉錄量
  improvement_is: 下游後果下降，且非整倍體率未上升
  co_measure:
  - cell death
  - proliferation
  wrong_direction_test: 加重下游後果，或只改變讀出而不改變狀態（掩蓋 endpoint）
  valid_in_scenarios:
  - S1
  - S2
  - S3
- id: OBJ-deselect
  class: deselect
  endpoint_level: cellular_outcome
  endpoint: 非整倍體細胞佔族群的比例
  assay: 單細胞 DNA 定序或 interphase FISH 的族群組成
  improvement_is: 異常細胞比例下降，且正常細胞的存活與增殖未同步下降
  co_measure:
  - cell death
  - proliferation
  - clonal fitness
  wrong_direction_test: 非選擇性殺傷，或正常細胞的死亡比例高於異常細胞
  valid_in_scenarios:
  - S1
  - S2
  - S3
- id: OBJ-protect
  class: protect
  endpoint_level: organismal
  feasible_in_hackathon: false
  endpoint: 二次惡性腫瘤風險與治療相關毒性
  assay: 臨床監測（不在本次範圍；交由主辦方與臨床團隊評估）
  improvement_is: 二次風險下降，且原發缺陷未惡化
  co_measure:
  - cell death
  - proliferation
  wrong_direction_test: 增加二次惡性腫瘤風險（例如提高染色體不穩定或基因毒性暴露）
  valid_in_scenarios:
  - S1
  - S2
  - S3
disease_direction_test: 一個候選若其已知作用會進一步降低有功能的 BubR1 量、削弱 SAC 訊號、或提高染色體錯分離率，即屬疾病自身的方向，不論它聲稱服務哪一類目標都淘汰。

