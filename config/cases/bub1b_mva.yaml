  improvement_is: 病人細胞的總 BubR1 相對對照上升，且 nocodazole 停滯指數同步改善
  co_measure:
  - cell death
  - proliferation
  wrong_direction_test: 任何已知會降低有功能的 BubR1 蛋白量或削弱 SAC 訊號的作用（例如 sirtuin 抑制劑量的 nicotinamide、MPS1／Aurora
    B／PLK1 抑制劑）即為方向錯誤
  # S1 完全成立；S3 下「提高總量」仍可能連帶提高截斷產物，因此是 conditional 而非 invalid——
  # 與 config/scenarios/bub1b_mva.scenarios.yaml 的 objective_validity 對齊（2026-10-19 red-team：
