limitations_en:
- 'A low pLDDT does not mean a region is unimportant: disordered segments are often
  functional.'
- UniProt features are annotation, not an experiment on this patient, and feature
  boundaries are drawn by hand.
- For a truncating variant, 'features lost downstream' is a structural inference.
  Whether any protein exists at all depends on the NMD prediction in report section
  2 and on the scenarios in section 8.
