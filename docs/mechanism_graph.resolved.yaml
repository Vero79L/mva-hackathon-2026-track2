- id: E04
  from: T2
  to: P
  claim: MVA 的錯義等位基因蛋白週轉率高，使 BUBR1 總量下降；這類錯義取代一致地落在激酶域之內或附近。結構基礎是 BUBR1 的激酶域其實是 pseudokinase——人類保留催化三聯體但催化活性對正確分離並非必需，與 ATP
    結合的殘基真正負責的是構形穩定性，因此該區域的取代破壞的是穩定性而非催化
  claim_en: In MVA, the missense allele's protein turns over rapidly and total BUBR1 abundance falls; substitutions of this
    class consistently occur in or near the kinase domain. The structural basis is that the BUBR1 kinase domain is a pseudokinase
    — the human protein retains the catalytic triad but catalysis is dispensable for accurate segregation, and the residues
    that would bind ATP instead govern conformational stability — so a substitution there destabilises the fold rather than
    abolishing catalysis.
  strength: measured_in_model
  model:
    system: MVA 病人來源細胞株＋功能性蛋白置換；人類 BUBR1 催化缺陷突變體
    system_en: MVA patient-derived cell lines + functional protein replacement; catalytically dead human BUBR1 mutants
    species: human
    genotype_match: same_gene_LoF
  sources:
  - pmid: '20516114'
    locator: main text; two-class analysis
    strength: measured_in_model
    title_hint: Molecular causes for BUBR1 dysfunction in the human cancer predisposition syndrome mosaic variegated aneuploidy
  - pmid: '22698286'
    locator: main text
    strength: measured_in_model
    title_hint: The vertebrate mitotic checkpoint protein BUBR1 is an unusual pseudokinase
  - pmid: '33207204'
    locator: main text
    strength: measured_in_model
    title_hint: BUBR1 Pseudokinase Domain Promotes Kinetochore PP2A-B56 Recruitment, Spindle Checkpoint Silencing, and Chromosome
      Alignment
  counterevidence: Suijkerbuijk 2010 分出兩類 MVA 突變：降低蛋白量，或特異性損害檢查點活性與微管附著。摘要給的方向是「降量類的錯義一致落在激酶域之內或附近」；該文內文（Results 標題、Fig 3、Discussion）確實也主張反方向——「所有落在激酶域的
    MVA 突變都降低 BUBR1 總量」——但這個全稱只涵蓋它實測的五個來自英國 MVA 病人的激酶域取代，不是對任意新變異的預測規則；而且 Fig 2A 顯示 N 端 TPR 域的取代也會降低蛋白量（幅度較小，全部病人細胞株為 2–6
    倍），因此實際是一個梯度而非兩個乾淨的分組。本案的取代未被測過。而 Gama Braga 2020（PMID 33207204）顯示該 pseudokinase 域本身是 KARD 磷酸化與 PP2A-B56 招募所必需，突變它會直接造成檢查點解除受阻與排列錯誤——因此域內錯義完全可能是功能損傷而非量的問題（情境
    S2），本案無法由文獻判定屬於哪一類
  counterevidence_en: 'Suijkerbuijk 2010 separates MVA mutations into two classes: those that lower protein abundance, and
    those that specifically impair checkpoint activity or microtubule attachment. That a kinase-domain missense belongs to
    the first class is the paper''s generalisation, not a measurement on this allele — The abstract''s direction is abundance-class
    => kinase-domain location. The body does assert the converse (Results heading and Fig. 3: ''All kinase domain-localized
    mutations in BUBR1 reduce overall BUBR1 protein abundance''; repeated in the Discussion), but that universal is quantified
    over the five kinase-domain substitutions from British MVA patients the paper actually tested, not over arbitrary novel
    variants; and Fig. 2A shows an N-terminal TPR-domain substitution lowering abundance as well, less steeply (2-6 fold across
    all patient lines), so it reads as a gradient rather than two clean bins. This child''s substitution was not among those
    tested. Gama Braga 2020 (PMID 33207204) cuts the other way: the pseudokinase domain is itself required for KARD phosphorylation
    and PP2A-B56 recruitment, and mutating it directly causes impaired checkpoint silencing and alignment errors — so a substitution
    inside the domain may well be a function lesion rather than an abundance problem (scenario S2). The literature cannot
    assign this case to either class.'
  scenario_dependent: true
- id: E05
  from: P
  to: C
  claim: 雙等位 MVA 病人細胞的 BUBR1 總量低，並表現檢查點受損與染色體排列缺陷；關鍵的是，外源表現 BUBR1 可以回復檢查點活性——證明 BUBR1 功能不足就是病人染色體分離錯誤的原因，也證明『提高 BUBR1』在病人細胞裡是可行的介入點
  claim_en: Cells from biallelic MVA patients have low total BUBR1 and show an impaired checkpoint with chromosome-alignment
    defects; critically, ectopic expression of BUBR1 restores checkpoint activity — establishing that BUBR1 insufficiency
    is what causes the segregation errors in patients, and that raising BUBR1 is a viable intervention point in patient cells.
  strength: measured_in_model
  model:
    system: MVA 病人來源細胞株＋外源 BUBR1 回補
    system_en: MVA patient-derived cell lines + ectopic BUBR1 rescue
    species: human
    genotype_match: same_gene_LoF
  sources:
  - pmid: '20516114'
    locator: main text; ectopic BUBR1 restores checkpoint
    strength: measured_in_model
    title_hint: Molecular causes for BUBR1 dysfunction in the human cancer predisposition syndrome mosaic variegated aneuploidy
  counterevidence: 回補用的是外源野生型 BUBR1，不是藥物提高內源蛋白量；兩者之間仍有一步未跨越。（2026-10-19 red-team：本邊原本並列 PMID 19407811 為第二來源，該文研究的是正常細胞內 prometaphase
    的 BubR1 乙醯化如何調節 APC/C 活性與有絲分裂時序，沒有 MVA 病人細胞、沒有總量測定、也沒有外源回補——不支持本邊，已移除。它支持的是 E16／E17 那條乙醯化—穩定性的軸）
  counterevidence_en: 'The rescue used ectopic wild-type BUBR1, not a drug raising the endogenous protein; one step still
    separates the two. (2026-10-19 adversarial review: this edge previously listed PMID 19407811 as a second source. That
    paper studies how BubR1 acetylation at prometaphase modulates APC/C activity and mitotic timing in normal cells — no MVA
    patient cells, no abundance measurement, no ectopic rescue. It does not support this edge and has been removed; it supports
    the acetylation–stability edges E16/E17 instead.)'
  scenario_dependent: true
